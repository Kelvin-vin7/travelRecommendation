<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Recommendation - Contact Us</title>
  <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about_us.html">About Us</a></li>
      <li><a href="contact_us.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <main class="page">
    <h1>Contact Us</h1>
    <p class="lead">Have a question or want to plan your next trip? Send us a message!</p>

    <form id="contactForm" class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Enter your message" required></textarea>

      <button type="submit">Submit</button>
    </form>
    <p id="formStatus" class="form-status"></p>
  </main>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("formStatus").textContent =
        "Thank you for contacting us! We will get back to you soon.";
      this.reset();
    });
  </script>
</body>
</html>
